name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  id-token: write   # for trusted publishing
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.actor.login != 'anthusbot' }}
    uses: AnthusAI/platform-ci/.github/workflows/semantic-release-reusable.yml@main
    with:
      python_version: "3.12"
      release_branch: "main"
      semantic_release_requirement: "python-semantic-release~=10.0"
      run_publish: true
    secrets:
      anthusbot_gh_token: ${{ secrets.ANTHUSBOT_GH_TOKEN }}
      semantic_release_pypi_token: ${{ secrets.PYPI_TOKEN }}

  publish-artifacts:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable

      - name: Install build backend
        run: python -m pip install --upgrade pip build
        working-directory: python

      - name: Build wheel and sdist
        run: python -m build
        working-directory: python

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: python/dist

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --manifest-path rust/Cargo.toml --allow-dirty

      - name: Check portable store registry version
        id: store-version
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request

          with open("rust/crates/virtuus-store/Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/virtuus-store/{version}",
              headers={"User-Agent": "Virtuus-release (github.com/AnthusAI/Virtuus)"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  published = json.load(response)["version"]["num"] == version
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(not published).lower()}\n")
          PY

      - name: Publish portable store to crates.io
        if: ${{ steps.store-version.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path rust/crates/virtuus-store/Cargo.toml --locked --allow-dirty

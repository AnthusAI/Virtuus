[tool.semantic_release]
version_source = "file"
major_on_zero = false
allow_zero_version = true
branch = "main"
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
version_toml = [
  "python/pyproject.toml:project.version",
  "rust/Cargo.toml:package.version",
  "rust/crates/virtuus-store/Cargo.toml:dependencies.virtuus.version",
]
version_variables = ["VERSION:VERSION:nf"]
version_pattern = "(?P<current_version>\\d+\\.\\d+\\.\\d+)"
upload_to_repository = false
upload_to_release = true
build_command = "cargo update --manifest-path rust/Cargo.toml -p virtuus --precise $NEW_VERSION"
assets = ["rust/Cargo.lock"]

[tool.semantic_release.commit_parser_options]
ignore_merge_commits = false
patch_tags = ["fix", "perf", "docs", "chore"]
minor_tags = ["feat"]

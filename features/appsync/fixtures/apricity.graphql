  excerptStart: Float
  audio: FileRef!
  analysis: FileRef
  analysisVersion: Int
  analyzedAt: AWSDateTime
  status: ClipStatus
  duration: Float
  sampleRate: Int
  channels: Int
  bpm: Float
  bpmStability: Float
  meter: Int
  key: String
  camelot: String

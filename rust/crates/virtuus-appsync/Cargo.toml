[package]
name = "virtuus-appsync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AppSync-compatible GraphQL server on the Virtuus storage engine"

[dependencies]
async-graphql = { version = "8.0.0-rc.5", features = ["dynamic-schema"] }
async-graphql-axum = "8.0.0-rc.5"
async-graphql-parser = "8.0.0-rc.5"
axum = "0.7"
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
tower = { version = "0.4", features = ["util"] }
virtuus-amplify = { path = "../virtuus-amplify" }

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
http = "1"
tempfile = "3"

[[test]]
name = "cucumber"
harness = false
path = "tests/cucumber.rs"

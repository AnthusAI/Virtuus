[package]
name = "virtuus-store"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Scoped conditional object storage and repairable catalog projections"

[features]
default = []
aws = ["dep:aws-sdk-s3", "dep:aws-sdk-dynamodb"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
libc = "0.2"
tempfile = "3"
virtuus = { path = "../..", default-features = false }

aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-sdk-dynamodb = { version = "1", optional = true }

[dev-dependencies]
aws-smithy-http-client = { version = "=1.5.0", features = ["test-util"] }
aws-smithy-types = "=1.8.1"
http = "1"
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[[test]]
name = "gherkin"
harness = false

[package]
name = "virtuus-amplify"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Amplify Gen2-shaped operations on the Virtuus storage engine"

[dependencies]
virtuus = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.18", features = ["draft202012"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.22"

[[test]]
name = "cucumber"
harness = false
path = "tests/cucumber.rs"

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
